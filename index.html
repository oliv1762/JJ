<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJJ - Portfolio</title>

  <style>
    /* Import af font */
    @font-face {
      font-family: 'Futura';
      src: local('Futura'), url('Futura.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    /* Projekttitel */
    .projects-title {
      font-family: 'Futura', sans-serif;
      font-size: 32px;
      font-weight: bold;
      text-align: left;
      margin: 0 auto 30px;
      max-width: 1200px;
      padding-left: 60px;
    }

    /* Bestemmer topbar og luft */
    .header-wrapper {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 300px;
      font-family: 'Futura', sans-serif;
      font-size: 16px;
      gap: 1.9px;
    }

    .line1 {
      font-weight: bold;
      font-size: 16px;
    }

    .line2 {
      font-size: 12px;
      color: #555;
    }

    /* Forhindrer uønsket horisontal scroll */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      padding-top: 100px;
      font-family: 'Futura', sans-serif;
      cursor: crosshair;
      position: relative;
    }

    /* Baggrundsbillede med gennemsigtighed */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('BG-J100.png');
      background-repeat: repeat;
      background-size: 100px 200px;
      opacity: 0.2;
      z-index: -1;
      pointer-events: none;
    }

    /* Fixed top-bar */
    header {
      left: 0;
      width: 100%;
      display: flex;
      align-items: flex-end;
      padding: 20px 60px;
      position: fixed; top: 0;
      background-color: white;
      z-index: 1000;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .logo {
      height: 110px;
      cursor: crosshair;
    }

    .btn-portfolio, .btn-contact {
      padding: 10px 20px;
      background-color: white;
      color: black;
      border: 3px solid black;
      border-radius: 0;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      cursor: crosshair;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .btn-portfolio:hover, .btn-contact:hover {
      background-color: black;
      color: white;
    }

    /* Projekt-galleri */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      padding: 60px 60px;
      margin: 0 auto;
    }

    .project-wrapper {
      display: flex;
      flex-direction: column;
    }

    .project-box {
      width: 100%;
      height: 250px;
      background-color: white;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .project-image {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease;
    }

    .project-box:hover .project-image {
      transform: scale(1.05);
    }

    .project-text {
      background-color: rgba(255, 255, 255, 0.1);
      text-align: left;
      padding: 10px 15px;
      border-top: 2px solid #555;
      font-family: 'Futura', sans-serif;
      font-weight: bold;
      font-size: 16px;
      margin-top: 0px;
    }

    /* Footer med LinkedIn-ikon */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 0;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: white;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }

    .linkedin-icon {
      width: 40px;
      height: auto;
      transition: transform 0.3s ease, opacity 0.3s ease;
      cursor: crosshair;
    }

    .linkedin-icon:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }

    /* Mobilvenlig */
    @media (max-width: 600px) {
      .projects {
        padding: 50px 50px;
        gap: 15px;
      }
      header {
        flex-direction: row;
        align-items: center;
        padding-left: 30px;
        padding-right: 30px;
      }
      .header-text {
        align-self: flex-end;
        font-size: 8px;
        gap: 0.85px;
      }
      .line1 { font-size: 8px; }
      .line2 { font-size: 6px; }
      .logo { height: 55px; }
      .project-text { font-size: 16px; }
    }
  </style>
</head>
