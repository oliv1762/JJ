<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJJ - Portfolio</title>
  <link rel="icon" type="image/png" href="LOGO-T-21.png">
  <style>
    @font-face {
      font-family: 'Futura';
      src: local('Futura'), url('Futura.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
      padding-top: 100px;
      font-family: 'Futura', sans-serif;
      cursor: crosshair;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: url('BG-J100.png');
      background-repeat: repeat;
      background-size: 100px 200px;
      opacity: 0.2;
      z-index: -1;
      pointer-events: none;
    }

    /* Header */
    header {
      position: fixed; top: 0; left: 0;
      width: 100%;
      display: flex;
      align-items: flex-end;
      padding: 20px 60px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
      gap: 15px;
      transition: top 0.3s ease; /* til scroll-effekt */
    }
    .logo { height: 110px; cursor: crosshair; }
    .header-text { display: flex; flex-direction: column; justify-content: center; max-width: 300px; gap: 1.9px; }
    .line1 { font-weight: bold; font-size: 16px; }
    .line2 { font-size: 12px; color: #555; }

    /* Footer */
    .footer {
      position: fixed; bottom: -100px; /* skjult til start */
      left: 0; width: 100%;
      display: flex; justify-content: center; align-items: center;
      padding: 15px 0;
      background: white;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      transition: bottom 0.3s ease;
    }
    .linkedin-icon { width: 40px; cursor: crosshair; transition: transform 0.3s ease, opacity 0.3s ease; }
    .linkedin-icon:hover { transform: scale(1.1); opacity: 0.8; }

    /* Projekter */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      padding: 120px 60px 60px; /* ekstra top til header */
      margin: 0 auto;
    }
    .project-box {
      position: relative;
      height: 250px;
      background-size: cover;
      background-position: center;
      cursor: crosshair;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .project-box:hover { transform: scale(1.03); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .project-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex; align-items: flex-start; justify-content: flex-start;
      padding: 15px;
    }
    .project-box:hover .project-overlay { opacity: 1; }
    .project-title {
      font-family: 'Futura', sans-serif;
      font-weight: bold;
      font-size: 20px;
      color: white;
      text-align: left;
    }

    @media (max-width: 600px) {
      header { flex-direction: row; align-items: center; padding: 0 30px; }
      .header-text { font-size: 8px; gap: 0.85px; align-self: flex-end; }
      .line1 { font-size: 8px; }
      .line2 { font-size: 6px; }
      .logo { height: 55px; }
      .project-title { font-size: 16px; }
      .projects { padding: 50px; gap: 15px; }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header id="header">
    <a href="/"><img src="LOGO-T-21.png" alt="Logo" class="logo" /></a>
    <div class="header-text">
      <div class="line1">Cand.arch. MAA, Byplanlægger</div>
      <div class="line2">Oliver Juul Jensen</div>
      <div class="line2">Mail: <a href="mailto:oliverjuuljensen@yahoo.dk" style="color: inherit; text-decoration: none;">oliverjuuljensen@yahoo.dk</a></div>
      <div class="line2">Tlf: <a href="tel:+4528499459" style="color: inherit; text-decoration: none;">28 49 94 59</a></div>
    </div>
  </header>

  <!-- Projekter -->
  <div class="projects">
    <div class="project-box" style="background-image: url('project1.jpg');">
      <div class="project-overlay"><div class="project-title">Projekt 1</div></div>
    </div>
    <div class="project-box" style="background-image: url('project2.jpg');">
      <div class="project-overlay"><div class="project-title">Projekt 2</div></div>
    </div>
    <div class="project-box" style="background-image: url('project3.jpg');">
      <div class="project-overlay"><div class="project-title">Projekt 3</div></div>
    </div>
    <!-- ... resten af projekterne ... -->
  </div>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <a href="https://www.linkedin.com/in/oliver-jensen-a1b81017a/" target="_blank">
      <img src="LinkedIn-01.png" alt="LinkedIn" class="linkedin-icon">
    </a>
  </footer>

  <script>
    let lastScroll = 0;
    const header = document.getElementById('header');
    const footer = document.getElementById('footer');

    window.addEventListener('scroll', () => {
      const currentScroll = window.pageYOffset;

      // Header skjul/vis
      if (currentScroll > lastScroll && currentScroll > 100) {
        header.style.top = '-120px';
      } else {
        header.style.top = '0';
      }
      lastScroll = currentScroll;

      // Footer vis kun i bunden
      const scrollBottom = window.innerHeight + window.pageYOffset >= document.body.offsetHeight - 10;
      if (scrollBottom) {
        footer.style.bottom = '0';
      } else {
        footer.style.bottom = '-100px';
      }
    });
  </script>
</body>
</html>
