<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OJJ - Portfolio</title>
  <link rel="icon" type="image/png" href="LOGO-T-21.png">
  <style>
    @font-face {
      font-family: 'Futura';
      src: local('Futura'), url('Futura.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      padding-top: 100px;
      font-family: 'Futura', sans-serif;
      cursor: crosshair;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('BG-J100.png');
      background-repeat: repeat;
      background-size: 100px 200px;
      opacity: 0.2;
      z-index: -1;
      pointer-events: none;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: flex-end;
      padding: 20px 100px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      z-index: 1000;
      gap: 15px;
      transition: top 1s ease;
      flex-wrap: wrap;
    }

    .logo { height: 110px; cursor: crosshair; }

    .header-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 300px;
      gap: 1.9px;
    }

    .line1 { font-weight: bold; font-size: 16px; }
    .line2 { font-size: 12px; color: #555; }

    /* Footer */
    .footer {
      position: fixed;
      bottom: -100px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px 0;
      background: white;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      z-index: 1000;
      transition: bottom 0.3s ease;
    }

    .linkedin-icon {
      width: 40px;
      cursor: crosshair;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .linkedin-icon:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }

    /* Projekter - dynamiske bredder med fixed height */
.projects {
  display: flex;
  flex-wrap: wrap;
  gap: 25px;
  padding-top: 120px;
  padding-left: 120px; /* juster så den flugter med logoets venstre kant */
  padding-right: 60px;
  padding-bottom: 120px;
  margin: 0 auto;
  justify-content: flex-start; /* så de starter fra venstre */
}
    .project-box {
      position: relative;
      display: block;
      height: 250px;         /* fast højde */
      overflow: hidden;
      cursor: crosshair;
      flex: 0 0 auto;        /* bredden følger billedets proportion */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project-box img {
      height: 100%;          /* fylder højde */
      width: auto;           /* bredde følger billedets proportion */
      display: block;
    }

    .project-box:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Top overlay til hover */
    .project-top-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(255,255,255,0);
      transition: background 1.2s ease;
      display: flex;
      align-items: center;
      padding-left: 15px;
    }

    .project-box:hover .project-top-overlay {
      background: rgba(255,255,255,1);
    }

    .project-top-overlay .project-title {
      font-family: 'Futura', sans-serif;
      font-weight: bold;
      font-size: 20px;
      color: rgba(0,0,0,0);
      transition: color 1.2s ease;
    }

    .project-box:hover .project-top-overlay .project-title {
      color: rgba(0,0,0,1);
    }

    /* RESPONSIVE STYLES */
    @media (max-width: 1024px) {
      header {
        padding: 20px 50px;
      }
      .projects {
        padding: 120px 40px 120px 40px;
        gap: 20px;
      }
    }

    @media (max-width: 768px) {
      header {
        padding: 15px 30px;
      }
      .logo { height: 80px; }
      .header-text { max-width: 200px; gap: 1px; }
      .line1 { font-size: 14px; }
      .line2 { font-size: 10px; }
      .projects { padding: 120px 20px 120px 20px; gap: 15px; }
      .project-box { height: 200px; }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 15px;
      }
      .logo { height: 55px; }
      .header-text { font-size: 8px; max-width: 100%; gap: 0.8px; }
      .line1 { font-size: 10px; }
      .line2 { font-size: 8px; }
      .projects { padding: 100px 10px 80px 10px; gap: 10px; justify-content: center; }
      .project-box { height: 150px; }
      .project-top-overlay { height: 40px; padding-left: 10px; }
      .project-top-overlay .project-title { font-size: 14px; }
    }

  </style>
</head>

  <script>
  const header = document.querySelector('.header-wrapper');

  window.addEventListener('scroll', () => {
    if(window.scrollY === 0){
      // Hvis vi er helt i toppen
      header.style.transform = 'translateY(0)';
    } else {
      // Ellers skjul header
      header.style.transform = 'translateY(-100%)';
    }
  });
